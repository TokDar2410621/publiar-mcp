[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "publiar-mcp"
version = "0.1.6"
description = "Serveur MCP qui ecrit des lead magnets LinkedIn et refuse d'inventer : 6 regles anti-hallucination bloquantes, 8 archetypes visuels, publication et suivi."
authors = [{ name = "Darius Tokam", email = "tokamdarius@gmail.com" }]
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "linkedin",
    "lead-magnet",
    "claude",
    "ai-agents",
    "content-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: French",
]
dependencies = [
    # Borne haute indispensable : mcp 2.0 a supprime Server.list_tools, et
    # publiar-mcp 0.1.1 est parti sur PyPI avec mcp>=1.0.0. pip a donc
    # installe la 2.x et le paquet plantait a l'import, des l'installation.
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://publiar.app"
Repository = "https://github.com/TokDar2410621/publiar-mcp"
Issues = "https://github.com/TokDar2410621/publiar-mcp/issues"

[project.scripts]
publiar-mcp = "publiar_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["publiar_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "publiar_mcp",
    "examples",
    "README.md",
    "LICENSE",
    "server.json",
]
