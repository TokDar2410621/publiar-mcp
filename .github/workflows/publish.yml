name: Publier publiar-mcp

# Un tag vN.N.N declenche toute la chaine : construction, PyPI, registre MCP.
# Aucun secret n'est stocke. PyPI et le registre acceptent tous deux l'OIDC
# de GitHub Actions, donc il n'existe aucun jeton a faire fuir ni a faire
# tourner. C'est `id-token: write` qui autorise les deux.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier que les versions concordent
        # pyproject.toml fait foi. Le tag, quand il y en a un, doit s'y
        # conformer. PyPI fige une version pour toujours : une derive
        # decouverte apres coup se paye d'un numero brule.
        run: |
          PYPROJECT=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          SERVERJSON=$(jq -r '.version' server.json)
          SERVERPKG=$(jq -r '.packages[0].version' server.json)
          if [ "$PYPROJECT" != "$SERVERJSON" ] || [ "$PYPROJECT" != "$SERVERPKG" ]; then
            echo "divergence : pyproject=$PYPROJECT server.json=$SERVERJSON paquet=$SERVERPKG" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$PYPROJECT" ]; then
            echo "Tag $GITHUB_REF_NAME mais pyproject.toml dit $PYPROJECT" >&2
            exit 1
          fi
          echo "version=$PYPROJECT" >> "$GITHUB_ENV"

      - name: Verifier les limites du schema server.json
        # Le registre refuse en 422 sur des longueurs, apres que PyPI a deja
        # fige la version. Vecu le 2026-08-12 : une description de 165
        # caracteres pour une limite de 100. La garde se paye ici, pas la-bas.
        run: |
          for champ in description title; do
            LEN=$(jq -r --arg c "$champ" '.[$c] // "" | length' server.json)
            if [ "$LEN" -gt 100 ]; then
              echo "server.json .$champ fait $LEN caracteres, la limite est 100" >&2
              exit 1
            fi
          done
          NAMELEN=$(jq -r '.name | length' server.json)
          if [ "$NAMELEN" -gt 200 ] || [ "$NAMELEN" -lt 3 ]; then
            echo "server.json .name fait $NAMELEN caracteres, attendu entre 3 et 200" >&2
            exit 1
          fi

      - name: Verifier le marqueur de propriete
        # Sans cette chaine dans le README, le registre refusera de croire
        # que le paquet PyPI est le tien, et l'etape finale echouera apres
        # que PyPI aura deja fige la version.
        run: |
          grep -q "mcp-name: io.github.tokdar2410621/publiar" README.md \
            || { echo "marqueur mcp-name absent du README" >&2; exit 1; }

      - name: Construire
        run: |
          pip install --upgrade build
          python -m build

      - name: Publier sur PyPI
        # Bascule seule en OIDC quand aucun jeton n'est fourni.
        # skip-existing rend le workflow rejouable : si le registre a echoue
        # apres que PyPI a reussi, on relance sans buter sur la version deja
        # en ligne, et sans avoir a bruler un numero.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Installer mcp-publisher
        # Le curl anonyme de la doc officielle a rendu 107 octets au lieu de
        # 7 Mo le 2026-08-12, etrangle cote runner, et ces 107 octets sont
        # partis dans tar qui a echoue sur un message obscur. gh release
        # download passe par le jeton du job, donc pas de limite anonyme, et
        # la verification finale refuse un binaire qui ne demarre pas.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for essai in 1 2 3; do
            gh release download --repo modelcontextprotocol/registry \
              --pattern "mcp-publisher_linux_amd64.tar.gz" \
              --output mcp-publisher.tar.gz --clobber && break
            echo "tentative $essai echouee, nouvelle tentative dans 5 s" >&2
            sleep 5
          done
          file mcp-publisher.tar.gz | grep -q "gzip compressed" \
            || { echo "archive invalide : $(ls -l mcp-publisher.tar.gz)" >&2; exit 1; }
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: S'authentifier au registre MCP
        run: ./mcp-publisher login github-oidc

      - name: Publier au registre MCP
        run: ./mcp-publisher publish

      - name: Verifier depuis l'exterieur
        # Ce que la commande precedente affiche ne prouve rien. Seule une
        # requete au registre depuis le reseau public le fait.
        run: |
          sleep 10
          curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers?search=publiar" \
            | grep -q "io.github.tokdar2410621/publiar" \
            && echo "reference dans le registre" \
            || { echo "absent du registre apres publication" >&2; exit 1; }
